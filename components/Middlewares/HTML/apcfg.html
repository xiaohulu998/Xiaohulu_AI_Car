<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>ESP32-S3 WiFi 配网</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f0f2f5;
      --panel: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #e0e7ff;
      --danger: #ef4444;
      --ok: #10b981;
      --warn: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow: 0 4px 24px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.12);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(160deg, #eef2ff 0%, #e0e7ff 30%, #f0f2f5 70%, #faf5ff 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }

    main {
      width: 100%;
      max-width: 430px;
      background: var(--panel);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 0;
      overflow: hidden;
    }

    /* ── 头部 ── */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 40%, #818cf8 100%);
      color: #fff;
      padding: 24px 22px 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      font-size: 22px;
      flex: 0 0 auto;
    }

    .logo svg { width: 26px; height: 26px; fill: #fff; }

    .header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .3px;
      line-height: 1.3;
    }

    .header .ver {
      font-size: 12px;
      font-weight: 400;
      opacity: .75;
      margin-top: 1px;
    }

    /* ── 设备信息卡片 ── */
    .device-card {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(2px);
      border-radius: 12px;
      margin-top: 14px;
      padding: 6px 0;
    }

    .device-item {
      text-align: center;
      padding: 6px 4px;
    }

    .device-item + .device-item {
      border-left: 1px solid rgba(255,255,255,.18);
    }

    .device-val {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .device-label {
      font-size: 10px;
      opacity: .7;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* ── 内容区 ── */
    .body { padding: 20px 22px 24px; }

    /* ── 连接状态 ── */
    .conn {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      margin-bottom: 18px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fefce8;
      color: #b45309;
      font-size: 13px;
      line-height: 1.4;
      border: 1px solid #fde68a;
    }

    .conn-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .conn.ok {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }

    .conn.ok .conn-dot {
      animation: pulse 2s infinite;
    }

    .conn.err {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }

    .conn.success {
      background: #ecfdf5;
      color: #065f46;
      border-color: #6ee7b7;
    }

    .conn.success .conn-dot {
      background: var(--ok);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(1.5); }
    }

    /* ── 按钮 ── */
    .row-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .btn {
      height: 42px;
      border: 0;
      border-radius: 21px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { transform: scale(.97); }

    .btn:disabled {
      cursor: wait;
      opacity: .6;
      transform: none;
    }

    .btn-scan {
      flex: 0 0 auto;
      min-width: 120px;
      padding: 0 18px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 650;
    }

    .btn-scan:hover:not(:disabled) { background: #c7d2fe; }

    .btn-scan.scanning {
      background: #c7d2fe;
    }

    .btn-scan.scanning::after {
      content: '';
      width: 14px;
      height: 14px;
      border: 2px solid var(--primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .scan-hint {
      font-size: 12px;
      color: var(--muted);
      align-self: center;
    }

    /* ── WiFi 列表 ── */
    .wifi-panel {
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fafbfc;
      overflow: hidden;
    }

    .wifi-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .wifi-list {
      max-height: 240px;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .wifi-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: background .12s ease;
    }

    .wifi-list li:last-child { border-bottom: 0; }

    .wifi-list li:hover,
    .wifi-list li:active,
    .wifi-list li.active {
      background: var(--primary-light);
    }

    .wifi-list li.active {
      border-left: 3px solid var(--primary);
      padding-left: 10px;
    }

    .wifi-signal {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
      width: 18px;
    }

    .wifi-signal .bar {
      width: 3px;
      border-radius: 1px;
      background: #d1d5db;
      transition: background .15s;
    }

    .wifi-list li.active .wifi-signal .bar,
    .wifi-signal.s-3 .bar { background: var(--ok); }
    .wifi-signal.s-2 .bar:nth-child(-n+3) { background: var(--warn); }
    .wifi-signal.s-1 .bar:nth-child(-n+2) { background: var(--warn); }
    .wifi-signal.s-0 .bar:nth-child(-n+1) { background: var(--danger); }

    .wifi-ssid {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wifi-meta {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .wifi-lock { font-size: 11px; }

    .wifi-empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── 表单 ── */
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 650;
      color: #374151;
    }

    .field { margin-bottom: 16px; }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      background: #f9fafb;
      color: var(--text);
      font-size: 15px;
      outline: none;
      padding: 0 14px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,.12);
      background: #fff;
    }

    input::placeholder { color: #9ca3af; }

    .password-row input { padding-right: 60px; }

    .toggle {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 48px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: #e5e7eb;
      color: #6b7280;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s;
    }

    .toggle:hover { background: #d1d5db; }

    .tip {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    /* ── 提交按钮 ── */
    .submit {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 25px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: 0 4px 14px rgba(99,102,241,.35);
      letter-spacing: .5px;
    }

    .submit:hover { box-shadow: 0 6px 20px rgba(99,102,241,.45); }
    .submit:active {
      transform: scale(.98);
      box-shadow: 0 2px 8px rgba(99,102,241,.3);
    }

    .submit:disabled {
      cursor: wait;
      opacity: .65;
      transform: none;
      box-shadow: none;
    }

    .submit.success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 14px rgba(16,185,129,.35);
    }

    /* ── 状态提示 ── */
    .status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      transition: color .2s;
    }

    .status.ok { color: var(--ok); font-weight: 600; }
    .status.err { color: var(--danger); font-weight: 600; }

    /* ── 响应式 ── */
    @media (max-width: 380px) {
      body { padding: 10px 6px; }
      .header { padding: 20px 16px 18px; }
      .body { padding: 16px 16px 20px; }
      .device-card { gap: 2px; }
      .device-val { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C17.93 3.9 6.07 3.9 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-6-6l2 2c2.76-2.76 7.24-2.76 10 0l2-2C13.17 7.07 6.83 7.07 3 11z"/></svg>
        </div>
        <div>
          <h1>ESP32-S3 WiFi 配网</h1>
          <div class="ver">AI 智能小车 · 无线配网</div>
        </div>
      </div>
      <div class="device-card">
        <div class="device-item">
          <div class="device-val" id="devChip">ESP32-S3</div>
          <div class="device-label">芯片</div>
        </div>
        <div class="device-item">
          <div class="device-val" id="devFlash">16 MB</div>
          <div class="device-label">Flash</div>
        </div>
        <div class="device-item">
          <div class="device-val" id="devHeap">-- KB</div>
          <div class="device-label">空闲内存</div>
        </div>
      </div>
    </div>

    <div class="body">
      <div class="conn" id="connState">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="connText">正在连接设备...</span>
      </div>

      <div class="row-actions">
        <button class="btn btn-scan" id="scanBtn" type="button" disabled>扫描 WiFi</button>
        <span class="scan-hint">JSON 协议通信</span>
      </div>

      <div class="wifi-panel">
        <div class="wifi-panel-head">
          <span>📡 附近热点</span>
          <span id="wifiCount">0 个</span>
        </div>
        <ul class="wifi-list" id="wifiList">
          <li class="wifi-empty">连接 WebSocket 后点击「扫描 WiFi」</li>
        </ul>
      </div>

      <form id="wifiForm" autocomplete="on">
        <div class="field">
          <label for="ssid">WiFi 名称</label>
          <input
            id="ssid" name="ssid" type="text" maxlength="32"
            placeholder="请输入或从列表选择 SSID"
            autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <p class="tip">可手动输入，也可从上方扫描列表点选。</p>
        </div>

        <div class="field">
          <label for="password">WiFi 密码</label>
          <div class="input-wrap password-row">
            <input
              id="password" name="password" type="password" maxlength="64"
              placeholder="开放网络可留空" autocomplete="current-password">
            <button class="toggle" id="togglePass" type="button">显示</button>
          </div>
        </div>

        <button class="submit" id="submitBtn" type="submit" disabled>保存并连接</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script>
    var ws = null;
    var reconnectTimer = null;
    var scanning = false;
    var selectedSsid = '';

    /* ── DOM 引用 ── */
    var connState = document.getElementById('connState');
    var connText = document.getElementById('connText');
    var submitBtn = document.getElementById('submitBtn');
    var scanBtn = document.getElementById('scanBtn');
    var statusEl = document.getElementById('status');
    var wifiList = document.getElementById('wifiList');
    var wifiCount = document.getElementById('wifiCount');
    var ssidInput = document.getElementById('ssid');
    var passwordInput = document.getElementById('password');

    /* ── 连接状态 ── */
    function setConnectionState(type, text) {
      connState.className = 'conn' + (type ? ' ' + type : '');
      connText.textContent = text;
      var online = type === 'ok';
      submitBtn.disabled = !online;
      scanBtn.disabled = !online || scanning;
    }

    function setStatus(type, text) {
      statusEl.className = 'status' + (type ? ' ' + type : '');
      statusEl.textContent = text || '';
    }

    function isWsOpen() {
      return ws && ws.readyState === WebSocket.OPEN;
    }

    function sendJson(obj) {
      if (!isWsOpen()) {
        setStatus('err', '设备未连接，正在重连...');
        initWebSocket();
        return false;
      }
      ws.send(JSON.stringify(obj));
      return true;
    }

    /* ── 信号强度 ── */
    function rssiBars(rssi) {
      var n = Number(rssi);
      if (isNaN(n)) return '<div class="wifi-signal s-0">' + barsHTML(0) + '</div>';
      var level = n >= -55 ? 3 : n >= -70 ? 2 : n >= -85 ? 1 : 0;
      return '<div class="wifi-signal s-' + level + '">' + barsHTML(level) + '</div>';
    }

    function barsHTML(level) {
      var h = ['30%','55%','75%','100%'];
      var s = '';
      for (var i = 0; i < 4; i++) {
        s += '<span class="bar" style="height:' + h[i] + '"></span>';
      }
      return s;
    }

    function rssiLabel(rssi) {
      var n = Number(rssi);
      return isNaN(n) ? '--' : (n >= -55 ? '强 ' : n >= -70 ? '中 ' : '弱 ') + n + ' dBm';
    }

    /* ── 渲染 WiFi 列表 ── */
    function renderWifiList(list) {
      wifiList.innerHTML = '';

      if (!list || !list.length) {
        wifiCount.textContent = '0 个';
        wifiList.innerHTML = '<li class="wifi-empty">未扫描到热点，请重试</li>';
        return;
      }

      list = list.slice().sort(function (a, b) {
        return (Number(b.rssi) || -999) - (Number(a.rssi) || -999);
      });

      wifiCount.textContent = list.length + ' 个';

      list.forEach(function (item) {
        var ssid = (item && item.ssid != null) ? String(item.ssid) : '';
        if (!ssid) return;

        var encrypted = !!(item.encrypted);
        var li = document.createElement('li');
        if (ssid === selectedSsid) li.className = 'active';
        li.setAttribute('data-ssid', ssid);
        li.setAttribute('data-encrypted', encrypted ? '1' : '0');
        li.innerHTML =
          rssiBars(item.rssi) +
          '<span class="wifi-ssid"></span>' +
          '<span class="wifi-meta">' +
            '<span class="wifi-lock">' + (encrypted ? '🔒' : '开放') + '</span>' +
            '<span>' + rssiLabel(item.rssi) + '</span>' +
          '</span>';
        li.querySelector('.wifi-ssid').textContent = ssid;

        li.addEventListener('click', function () { selectWifi(ssid, encrypted); });
        wifiList.appendChild(li);
      });

      if (!wifiList.children.length) {
        wifiCount.textContent = '0 个';
        wifiList.innerHTML = '<li class="wifi-empty">列表无有效 SSID</li>';
      }
    }

    function selectWifi(ssid, encrypted) {
      selectedSsid = ssid;
      ssidInput.value = ssid;

      var items = document.querySelectorAll('#wifiList li[data-ssid]');
      for (var i = 0; i < items.length; i++) {
        items[i].className = items[i].getAttribute('data-ssid') === ssid ? 'active' : '';
      }

      if (encrypted) {
        passwordInput.placeholder = '请输入密码';
        passwordInput.focus();
        setStatus('', '已选择「' + ssid + '」，请输入密码后连接。');
      } else {
        passwordInput.value = '';
        passwordInput.placeholder = '开放网络可留空';
        setStatus('ok', '已选择开放网络「' + ssid + '」，可直接连接。');
      }
    }

    /* ── 处理设备消息 ── */
    function handleDeviceMessage(raw) {
      var text = String(raw || '').trim();
      if (!text) return;

      var data;
      try { data = JSON.parse(text); } catch (e) { setStatus('ok', text); return; }

      /* 配网反馈：设备已收到密码，正在连接 */
      if (data && data.status === 'connecting') {
        setStatus('ok', '✅ 配网信息已收到，设备正在连接路由器...');
        submitBtn.textContent = '连接中...';
        submitBtn.classList.add('success');
        submitBtn.disabled = true;
        connState.className = 'conn success';
        connText.textContent = '✅ 设备正在连接路由器...';
        setTimeout(function () {
          setStatus('ok', '✅ 设备正在连接，请将手机切回原 WiFi 网络');
          connText.textContent = '✅ 请将手机切回原 WiFi 网络';
        }, 3000);
        return;
      }

      /* 设备信息 */
      if (data && data.device_info) {
        var info = data.device_info;
        if (info.chip) document.getElementById('devChip').textContent = info.chip;
        if (info.flash) document.getElementById('devFlash').textContent = info.flash;
        if (info.free_heap) document.getElementById('devHeap').textContent = (info.free_heap / 1024).toFixed(0) + ' KB';
        return;
      }

      /* 扫描结果 */
      if (data && Object.prototype.hasOwnProperty.call(data, 'wifi_list')) {
        scanning = false;
        scanBtn.disabled = !isWsOpen();
        scanBtn.textContent = '扫描 WiFi';
        scanBtn.classList.remove('scanning');
        renderWifiList(Array.isArray(data.wifi_list) ? data.wifi_list : []);
        setStatus('ok', '扫描完成，请选择热点。');
        return;
      }

      setStatus('ok', text);
    }

    /* ── WebSocket ── */
    function initWebSocket() {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

      var wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
      setConnectionState('', '正在连接设备...');
      ws = new WebSocket(wsUrl);

      ws.onopen = function () {
        setConnectionState('ok', '设备已连接');
        setStatus('', '');
      };

      ws.onmessage = function (event) { handleDeviceMessage(event.data); };

      ws.onerror = function () { setConnectionState('err', '连接异常'); };

      ws.onclose = function () {
        scanning = false;
        setConnectionState('err', '连接已断开，正在重连...');
        reconnectTimer = setTimeout(initWebSocket, 1500);
      };
    }

    /* ── 扫描 ── */
    function startScan() {
      if (scanning) return;
      if (!sendJson({ scan: 'start' })) return;
      scanning = true;
      scanBtn.disabled = true;
      scanBtn.textContent = '扫描中...';
      scanBtn.classList.add('scanning');
      setStatus('', '正在扫描附近 WiFi...');
    }

    /* ── 提交配网 ── */
    function sendWifiConfig() {
      var ssidValue = ssidInput.value.trim();
      var passwordValue = passwordInput.value;

      if (!ssidValue) {
        setStatus('err', '请输入或选择 WiFi 名称。');
        ssidInput.focus();
        return;
      }

      if (!sendJson({ ssid: ssidValue, password: passwordValue })) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '已发送';
      setStatus('ok', '配网信息已发送，等待设备响应...');
    }

    /* ── 事件绑定 ── */
    scanBtn.addEventListener('click', startScan);

    document.getElementById('togglePass').addEventListener('click', function () {
      var visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      this.textContent = visible ? '显示' : '隐藏';
    });

    document.getElementById('wifiForm').addEventListener('submit', function (event) {
      event.preventDefault();
      sendWifiConfig();
    });

    window.addEventListener('load', initWebSocket);
  </script>
</body>
</html>
